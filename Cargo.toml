[package]
name = "sst"
version = "0.1.0"
edition = "2024"
description = "Terminal query editor for Microsoft SQL Server"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sanisoclem/sst"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4.45"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
dirs = "6"
futures-util = "0.3"
getrandom = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_xlsxwriter = { version = "0.99", features = ["constant_memory"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.8"
tui-textarea = "0.7"
urlencoding = "2"

[profile.release]
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
